version: '3.8'

services:
  db:
    image: postgres:14.3
    restart: always
    container_name: TESLODB
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: postgres
    volumes:
      - ./postgres:/var/lib/postgresql/data